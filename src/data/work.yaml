- id: ptk
  order: 1
  short: ptk
  catch: { value: "76%", label: "fewer tokens on JSON, code, logs, records and prose (tiktoken cl100k), 89% on code alone" }
  kind: Open source · Python
  title: ptk, the Python Token Killer
  body: Agents burn context on nulls, docstrings and log spam. Python Token Killer is a dependency-free library that compresses any Python object, whether JSON, code, logs or diffs, before it reaches a model. One call, on PyPI.
  link: { href: "https://github.com/amahi2001/python-token-killer", text: Source and benchmarks }
